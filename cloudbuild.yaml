# Cloud Build: build backend image and deploy to Cloud Run.
# Trigger on push to main (or your chosen branch). First time: set env vars in Cloud Run.
# Substitutions: _REGION, _SERVICE_NAME (optional; defaults below).
substitutions:
  _REGION: us-central1
  _SERVICE_NAME: backend-api
  _REPO: backend

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build backend Docker image
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest
      - -f
      - Dockerfile
      - .
    dir: .

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push-backend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${BUILD_ID}
    waitFor: [build-backend]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest
    waitFor: [build-backend]

  # Deploy to Cloud Run (keeps existing env vars; set them once in Console or first manual deploy)
  # --no-deploy-health-check: build succeeds even if new revision fails startup probe (e.g. env not set yet)
  # --cpu-boost: full CPU during startup so the container can bind to PORT before the TCP probe fails
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --no-deploy-health-check
      - --cpu-boost
    waitFor: [push-backend]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest
