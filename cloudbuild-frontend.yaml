# Cloud Build: build frontend image and deploy to Cloud Run.
# Run from repo root: gcloud builds submit --config=cloudbuild-frontend.yaml .
# No local Docker required. Uses BUILD_ID for tag (set on every build; SHORT_SHA is empty on manual submit).
substitutions:
  _REGION: us-central1
  _SERVICE_NAME: frontend-web
  _REPO: frontend
  _NEXT_PUBLIC_API_URL: https://backend-api-1021282359242.us-central1.run.app

options:
  logging: CLOUD_LOGGING_ONLY
  # Next.js build can be memory-heavy; use a larger machine to avoid OOM
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - --platform=linux/amd64
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
      - ./frontend
    dir: .

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
    waitFor: [build-frontend]

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
    waitFor: [build-frontend]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:latest
